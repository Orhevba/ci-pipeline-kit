name: Example — Python project

on:
  push:
    branches: [master]
    paths:
      - "examples/python-project/**"
      - "examples/python-insecure/**"
      - ".github/workflows/example-python-ci.yml"
      - ".github/workflows/python-ci.yml"
      - ".github/workflows/python-security-scan.yml"
  pull_request:
    paths:
      - "examples/python-project/**"
      - "examples/python-insecure/**"
      - ".github/workflows/example-python-ci.yml"
      - ".github/workflows/python-ci.yml"
      - ".github/workflows/python-security-scan.yml"
  workflow_dispatch: {}

jobs:
  ci:
    uses: ./.github/workflows/python-ci.yml
    with:
      working-directory: examples/python-project

  # Proves the security scan on a real (tiny) project on every change to it. The example has no dependencies and no risky code, so
  # the strict defaults must pass - a failure here means the scan itself is broken, not the example.
  security:
    uses: ./.github/workflows/python-security-scan.yml
    with:
      working-directory: examples/python-project

  # The opposite proof: a project that is BAD on purpose (an insecure call and a known-vulnerable pin). In report-only mode the scan must
  # still run to the end, write its tables and pass. Before this existed, a bug that made the tools' non-zero exit stop the step before
  # the report was written went unnoticed, because the clean example above never triggers it.
  security-reports-problems:
    uses: ./.github/workflows/python-security-scan.yml
    with:
      working-directory: examples/python-insecure
      audit-fail: false
      bandit-fail-level: none
