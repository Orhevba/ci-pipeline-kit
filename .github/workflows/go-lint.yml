name: Go Lint

# Reusable workflow — called from another repo's workflow with:
#   jobs:
#     lint:
#       uses: <owner>/ci-pipeline-kit/.github/workflows/go-lint.yml@master
#       with:
#         go-version: "stable"

on:
  workflow_call:
    inputs:
      go-version:
        description: Go version to use
        type: string
        default: "stable"
      working-directory:
        description: Directory containing go.mod
        type: string
        default: "."

jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ inputs.go-version }}
          cache: true

      - name: Check formatting (gofmt)
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::The following files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...
